# logstash.conf  -  OPTIONAL pipeline: Filebeat -> Logstash -> Elasticsearch
#
# Use this if you prefer to do parsing in Logstash instead of Filebeat processors,
# or if you want to enrich events (GeoIP on ipAddress, drop noisy events, etc.)

input {
  beats {
    port => 5044
  }
}

filter {
  # Only Keycloak *event* lines have the key="value" format
  if [log][logger] == "org.keycloak.events" {
    kv {
      source       => "message"
      field_split  => ", "
      value_split  => "="
      trim_value   => "\""
      target       => "[keycloak][event]"
    }

    # Turn the client IP into a geo location (needs internet on first run to fetch the DB)
    geoip {
      source => "[keycloak][event][ipAddress]"
      target => "[keycloak][geo]"
    }

    # Example enrichment: mark failed logins so dashboards can count them easily
    if [keycloak][event][type] =~ /_ERROR$/ {
      mutate { add_field => { "[keycloak][outcome]" => "failure" } }
    } else {
      mutate { add_field => { "[keycloak][outcome]" => "success" } }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "keycloak-%{+YYYY.MM.dd}"
  }
}
